<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Real-time situation monitoring dashboard — incidents, traffic, weather, and cameras on a live map." />
    <meta name="theme-color" content="#1f2937" />
    <title>Situation Monitor</title>

    <!-- Leaflet + MarkerCluster CSS are bundled from node_modules (see

    %sveltekit.head%

  <body data-sveltekit-preload-data="hover" class="h-full">
    <div style="display: contents" class="h-full">%sveltekit.body%</div>
  </body>
</html>

name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          NODE_ENV: production
          BASE_PATH: /Situation-Monitor
          # Stable backend URL as a repo variable (Settings → Secrets and
          # variables → Actions → Variables): set PUBLIC_API_URL to a named
          # Cloudflare Tunnel / Tailscale Funnel hostname and re-run this
          # workflow — no commit needed. Never hardcode a quick-tunnel URL
          # here: those rotate on every cloudflared restart. Empty = the
          # deployed site renders but shows no live data.
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL || '' }}
          # Multi-region: both DC and Boise data are served by the backend.
          # PUBLIC_REGION is only the *initial* dropdown selection — users can
          # switch in the UI and the choice persists in localStorage.
          PUBLIC_REGION: ${{ vars.PUBLIC_REGION || 'boise' }}
          PUBLIC_REGION_LABEL: ${{ vars.PUBLIC_REGION_LABEL || '' }}
        run: npm run build --workspace=@situation-monitor/frontend

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

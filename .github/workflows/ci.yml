name: CI

on:
  push:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend type-check & build
        run: npm run build --workspace=@situation-monitor/backend

      - name: Tests (both workspaces)
        run: npm run test

      - name: Lint (both workspaces)
        run: npm run lint

      - name: Frontend type-check (svelte-check)
        run: npm run check --workspace=@situation-monitor/frontend

      - name: Frontend build
        run: npm run build --workspace=@situation-monitor/frontend
